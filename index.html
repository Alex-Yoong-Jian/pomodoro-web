<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* ── Layout ── */
    .pom-root { position: relative; min-height: 100vh; overflow: hidden; background: #000; }
    .pom-wrap { position: relative; z-index: 1; padding: 1.5rem 1rem; max-width: 480px; margin: 0 auto; }

    /* ── Background layers ── */
    #bg-canvas  { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.5s ease; }
    #yt-frame   { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; }

    /* ── Scene buttons ── */
    .scene-toggle { display: flex; gap: 6px; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .scene-btn { padding: 5px 14px; border-radius: 12px; font-size: 12px; border: 0.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55); cursor: pointer; transition: all 0.2s; }
    .scene-btn.active { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.4); }

    /* ── Mode tabs ── */
    .mode-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 1.5rem; }
    .mode-tab { padding: 6px 16px; border-radius: 20px; font-size: 13px; border: 0.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); cursor: pointer; transition: all 0.2s; }
    .mode-tab.active { background: rgba(83,74,183,0.7); color: #fff; border-color: rgba(83,74,183,0.5); font-weight: 500; }

    /* ── Cards ── */
    .card { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 0.5px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .card-title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85); }
    .divider { height: 0.5px; background: rgba(255,255,255,0.1); margin: 0.75rem 0; }

    /* ── Timer ── */
    .timer-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 0.5px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 2rem 1.5rem; text-align: center; margin-bottom: 1rem; }
    .session-label { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 0.5rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .timer-display { font-size: 72px; font-weight: 500; color: #fff; letter-spacing: -2px; line-height: 1; margin-bottom: 1.5rem; font-variant-numeric: tabular-nums; }
    .progress-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-bottom: 1.5rem; overflow: hidden; }
    .progress-fill { height: 100%; background: #7F77DD; border-radius: 2px; transition: width 1s linear; }
    .controls { display: flex; gap: 12px; justify-content: center; align-items: center; }
    .btn-main { padding: 10px 32px; border-radius: 20px; font-size: 15px; font-weight: 500; background: #534AB7; color: #fff; border: none; cursor: pointer; transition: opacity 0.2s; }
    .btn-main:hover { opacity: 0.85; }
    .btn-icon { width: 36px; height: 36px; border-radius: 50%; border: 0.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .btn-icon:hover { background: rgba(255,255,255,0.15); }
    .session-dots { display: flex; gap: 6px; justify-content: center; margin-top: 1rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); }
    .dot.done { background: #7F77DD; }

    /* ── Stats ── */
    .stats-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-bottom: 1rem; }
    .stat { background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 0.75rem; text-align: center; }
    .stat-val { font-size: 20px; font-weight: 500; color: #fff; }
    .stat-lbl { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }

    /* ── Volume rows ── */
    .vol-row { display: flex; align-items: center; gap: 10px; }
    .vol-row + .vol-row { margin-top: 0.5rem; }
    .vol-label { font-size: 12px; color: rgba(255,255,255,0.5); white-space: nowrap; min-width: 62px; }
    .vol-row input[type=range] { flex: 1; accent-color: #534AB7; }

    /* ── Music tracks ── */
    .toggle-btn { width: 32px; height: 32px; border-radius: 50%; background: #534AB7; border: none; color: #fff; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .track-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 0.75rem; }
    .track { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .track:hover { background: rgba(255,255,255,0.08); }
    .track.active { background: rgba(83,74,183,0.35); }
    .track-num { font-size: 12px; color: rgba(255,255,255,0.35); width: 16px; text-align: center; }
    .track-name { font-size: 13px; color: rgba(255,255,255,0.85); }
    .track-src { font-size: 11px; color: rgba(255,255,255,0.35); }
    .yt-status { font-size: 11px; color: rgba(255,255,255,0.35); text-align: center; margin-top: 0.5rem; }

    /* ── Footer ── */
    .footer { text-align: center; padding: 0.5rem 0 2rem; opacity: 0.45; }
  </style>
</head>
<body>
<div class="pom-root" id="pom-root">
  <div id="bg-overlay"></div>
  <canvas id="bg-canvas"></canvas>
  <div id="yt-frame"></div>

  <div class="pom-wrap">

    <!-- ═══════════════════════════════════════
         MODULE 1: SCENE / ATMOSPHERE
    ═══════════════════════════════════════ -->
    <div class="scene-toggle">
      <button class="scene-btn" id="sbtn-leaves"    onclick="Scene.toggle('leaves')">Leaves</button>
      <button class="scene-btn" id="sbtn-snow"      onclick="Scene.toggle('snow')">Snow</button>
      <button class="scene-btn" id="sbtn-rain"      onclick="Scene.toggle('rain')">Rain</button>
      <button class="scene-btn" id="sbtn-fireflies" onclick="Scene.toggle('fireflies')">Fireflies</button>
    </div>

    <!-- ═══════════════════════════════════════
         MODULE 2: TIMER
    ═══════════════════════════════════════ -->
    <div class="timer-card">
      <div class="session-label" id="timer-mode-label">Focus session</div>
      <div class="timer-display"  id="timer-display">25:00</div>
      <div class="progress-bar"><div class="progress-fill" id="timer-progress" style="width:100%"></div></div>
      <div class="controls">
        <button class="btn-icon" onclick="Timer.reset()" title="Reset">&#8635;</button>
        <button class="btn-main" id="timer-btn"          onclick="Timer.toggle()">Start</button>
        <button class="btn-icon" onclick="Timer.skip()"  title="Skip">&#8677;</button>
      </div>
      <div class="session-dots" id="timer-dots"></div>
      <div class="divider"></div>
      <div class="vol-row" style="margin-top:0;">
        <span class="vol-label">Timer bell</span>
        <input type="range" min="0" max="100" value="80" step="1" oninput="Timer.setBellVol(this.value)" />
      </div>
    </div>

    <!-- ═══════════════════════════════════════
         MODULE 3: STATS
    ═══════════════════════════════════════ -->
    <div class="stats-row">
      <div class="stat"><div class="stat-val" id="stat-sessions">0</div><div class="stat-lbl">Sessions</div></div>
      <div class="stat"><div class="stat-val" id="stat-focus">0</div><div class="stat-lbl">Focus mins</div></div>
      <div class="stat"><div class="stat-val" id="stat-streak">0</div><div class="stat-lbl">Streak</div></div>
    </div>

    <!-- ═══════════════════════════════════════
         MODULE 4: MOOD SOUNDS (shown when scene active)
    ═══════════════════════════════════════ -->
    <div class="card" id="mood-card" style="display:none;">
      <div class="card-header">
        <span class="card-title" id="mood-title">Mood sounds</span>
      </div>
      <div class="vol-row">
        <span class="vol-label">Volume</span>
        <input type="range" min="0" max="100" value="50" step="1" oninput="MoodAudio.setVol(this.value)" />
      </div>
    </div>

    <!-- ═══════════════════════════════════════
         MODULE 5: BACKGROUND MUSIC (YouTube)
    ═══════════════════════════════════════ -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Background music</span>
        <button class="toggle-btn" id="music-btn" onclick="Music.toggle()">&#9654;</button>
      </div>
      <div class="track-list" id="track-list"></div>
      <div class="divider" style="margin-bottom:0.75rem;"></div>
      <div class="vol-row">
        <span class="vol-label">Volume</span>
        <input type="range" min="0" max="100" value="40" step="1" oninput="Music.setVol(this.value)" />
      </div>
      <div class="yt-status" id="music-status">Click play to start</div>
    </div>

    <!-- ═══════════════════════════════════════
         MODULE 6: VISITOR COUNTER
    ═══════════════════════════════════════ -->
    <div class="footer">
      <img
        src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fpomodoro-web-chi.vercel.app&count_bg=%237F77DD&title_bg=%23000000&icon=&title=visitors&edge_flat=true"
        alt="visitor count"
        style="height:18px;"
      />
    </div>

  </div>
</div>

<audio id="mood-audio" loop></audio>
<audio id="bell-audio" src="https://cdn.jsdelivr.net/gh/freeCodeCamp/cdn@main/build/testable-projects-fcc/audio/BeepSound.wav"></audio>
<script src="https://www.youtube.com/iframe_api"></script>
<script>

/* ═══════════════════════════════════════════════════════
   MODULE 1: SCENE — handles background visuals + mood audio
   Completely self-contained. Exposes: Scene.toggle(name)
═══════════════════════════════════════════════════════ */
const Scene = (() => {
  const DEFS = {
    leaves: {
      label: 'Forest & leaves',
      sound: 'https://res.cloudinary.com/dbk2nmvor/video/upload/v1774950057/forest-nature_cvejvc.mp3',
      bg: ['#1a2a1a','#2d3a2d','#1a2535'], count: 38,
      make: (W,H) => ({ x:Math.random()*W, y:-20, size:6+Math.random()*10, speedY:0.6+Math.random()*1.2, speedX:-0.5+Math.random()*1, rot:Math.random()*360, rotSpeed:(-1+Math.random()*2)*1.2, swaySpeed:0.01+Math.random()*0.02, swayOffset:Math.random()*Math.PI*2, color:['#5a8a3a','#7aaa4a','#3a6a2a','#8aaa5a','#c8a030','#d4602a'][Math.floor(Math.random()*6)], t:0, W, H, alpha:1 }),
      draw: (p,ctx) => { ctx.save(); ctx.translate(p.x+Math.sin(p.swayOffset+p.t*p.swaySpeed)*36,p.y); ctx.rotate(p.rot*Math.PI/180); ctx.fillStyle=p.color; ctx.globalAlpha=0.82*p.alpha; ctx.beginPath(); ctx.ellipse(0,0,p.size*0.45,p.size,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=0.5; ctx.beginPath(); ctx.moveTo(0,-p.size); ctx.lineTo(0,p.size); ctx.stroke(); ctx.restore(); },
      update: (p,fading) => { p.t++; p.y+=p.speedY*(fading?1.8:1); p.x+=p.speedX+Math.cos(p.swayOffset+p.t*p.swaySpeed)*0.4; p.rot+=p.rotSpeed; if(fading) p.alpha=Math.max(0,p.alpha-0.008); return p.y<p.H+30&&p.alpha>0; }
    },
    snow: {
      label: 'Winter snowfall',
      sound: 'https://res.cloudinary.com/dbk2nmvor/video/upload/v1774950055/cold-snowfall_wcro7h.mp3',
      bg: ['#1a2535','#253045','#1a2030'], count: 60,
      make: (W,H) => ({ x:Math.random()*W, y:-10, size:2+Math.random()*5, speedY:0.4+Math.random()*0.9, speedX:-0.3+Math.random()*0.6, opacity:0.4+Math.random()*0.5, swaySpeed:0.008+Math.random()*0.015, t:Math.random()*100, W, H, alpha:1 }),
      draw: (p,ctx) => { ctx.save(); ctx.globalAlpha=p.opacity*p.alpha; ctx.fillStyle='#d0e8ff'; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.restore(); },
      update: (p,fading) => { p.t++; p.y+=p.speedY*(fading?1.8:1); p.x+=p.speedX+Math.sin(p.t*p.swaySpeed)*0.5; if(fading) p.alpha=Math.max(0,p.alpha-0.008); return p.y<p.H+10&&p.alpha>0; }
    },
    rain: {
      label: 'Relaxing rain',
      sound: 'https://res.cloudinary.com/dbk2nmvor/video/upload/v1774950059/relaxing-rain_dk2qvp.mp3',
      bg: ['#111820','#1a2530','#0e1520'], count: 80,
      make: (W,H) => ({ x:Math.random()*W, y:Math.random()*H*-1, len:10+Math.random()*20, speed:8+Math.random()*8, opacity:0.2+Math.random()*0.4, W, H, alpha:1 }),
      draw: (p,ctx) => { ctx.save(); ctx.globalAlpha=p.opacity*p.alpha; ctx.strokeStyle='#a0c8e8'; ctx.lineWidth=0.7; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.len*0.2,p.y+p.len); ctx.stroke(); ctx.restore(); },
      update: (p,fading) => { p.y+=p.speed*(fading?2:1); p.x-=p.speed*0.2; if(fading) p.alpha=Math.max(0,p.alpha-0.012); return p.y<p.H+30&&p.alpha>0; }
    },
    fireflies: {
      label: 'Night forest',
      sound: 'https://res.cloudinary.com/dbk2nmvor/video/upload/v1774950057/night-forest_whjxt1.mp3',
      bg: ['#0a1a10','#0e2015','#0a1520'], count: 30,
      make: (W,H) => ({ x:Math.random()*W, y:Math.random()*H, r:2+Math.random()*3, speedX:(-0.4+Math.random()*0.8)*0.6, speedY:(-0.4+Math.random()*0.8)*0.6, phase:Math.random()*Math.PI*2, phaseSpeed:0.02+Math.random()*0.03, t:0, W, H, alpha:1 }),
      draw: (p,ctx) => { const g=(Math.sin(p.phase+p.t*p.phaseSpeed)+1)/2; ctx.save(); ctx.globalAlpha=(0.15+g*0.7)*p.alpha; ctx.fillStyle='#c8f060'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r+g*2,0,Math.PI*2); ctx.fill(); ctx.restore(); },
      update: (p,fading) => { p.t++; p.x+=p.speedX; p.y+=p.speedY; if(fading) p.alpha=Math.max(0,p.alpha-0.006); else { if(p.x<0)p.x=p.W; if(p.x>p.W)p.x=0; if(p.y<0)p.y=p.H; if(p.y>p.H)p.y=0; } return p.alpha>0; }
    }
  };

  const canvas  = document.getElementById('bg-canvas');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('bg-overlay');
  const moodEl  = document.getElementById('mood-audio');

  let active=null, fading=false, particles=[], fadeTimer=null;

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function spawn() {
    if (!active) return;
    const d=DEFS[active], W=canvas.width, H=canvas.height;
    while (particles.length < d.count) particles.push(d.make(W,H));
  }

  function frame() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if (active || particles.length>0) {
      const d = DEFS[active || Object.keys(DEFS)[0]];
      if (!fading) spawn();
      particles = particles.filter(p => { d.draw(p,ctx); return d.update(p,fading); });
    }
    requestAnimationFrame(frame);
  }

  function setButtons(name) {
    document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
    if (name) document.getElementById('sbtn-'+name).classList.add('active');
  }

  function showMoodCard(name) {
    const card = document.getElementById('mood-card');
    if (name) {
      card.style.display = 'block';
      document.getElementById('mood-title').textContent = DEFS[name].label;
    } else {
      card.style.display = 'none';
    }
  }

  function startSound(name) {
    moodEl.src = DEFS[name].sound;
    moodEl.load();
    moodEl.currentTime = 0;
    moodEl.play().catch(()=>{});
  }

  function stopSound() {
    moodEl.pause();
    moodEl.src = '';
  }

  function fadeOut() {
    fading = true;
    overlay.style.opacity = '0';
    stopSound();
    showMoodCard(null);
    setButtons(null);
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(() => { fading=false; active=null; particles=[]; }, 2000);
  }

  function toggle(name) {
    if (active === name) { fadeOut(); return; }
    if (fading) { clearTimeout(fadeTimer); fading=false; }
    particles = [];
    active = name;
    const d = DEFS[name];
    overlay.style.background = 'linear-gradient(160deg,'+d.bg[0]+' 0%,'+d.bg[1]+' 40%,'+d.bg[2]+' 100%)';
    overlay.style.opacity = '1';
    setButtons(name);
    showMoodCard(name);
    startSound(name);
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  frame();

  return { toggle };
})();


/* ═══════════════════════════════════════════════════════
   MODULE 2: TIMER — handles countdown, modes, bell
   Exposes: Timer.toggle(), Timer.reset(), Timer.skip(), Timer.setBellVol(v)
═══════════════════════════════════════════════════════ */
const Timer = (() => {
  const MODES = {
    work:  { label:'Focus session', mins:25 },
    short: { label:'Short break',   mins:5  },
    long:  { label:'Long break',    mins:15 }
  };

  const bellEl = document.getElementById('bell-audio');
  bellEl.volume = 0.8;

  let mode='work', totalSecs=1500, remaining=1500;
  let running=false, iv=null;
  let sessions=0, focusMins=0, streak=0;

  function pad(n) { return String(n).padStart(2,'0'); }

  function render() {
    document.getElementById('timer-display').textContent = pad(Math.floor(remaining/60))+':'+pad(remaining%60);
    document.getElementById('timer-progress').style.width = Math.round((remaining/totalSecs)*100)+'%';
  }

  function renderDots() {
    const el = document.getElementById('timer-dots'); el.innerHTML='';
    for(let i=0;i<4;i++){const d=document.createElement('div');d.className='dot'+(i<sessions%4?' done':'');el.appendChild(d);}
  }

  function renderStats() {
    document.getElementById('stat-sessions').textContent = sessions;
    document.getElementById('stat-focus').textContent    = focusMins;
    document.getElementById('stat-streak').textContent   = streak;
  }

  function setMode(m) {
    mode=m; running=false; clearInterval(iv);
    document.getElementById('timer-btn').textContent = 'Start';
    totalSecs = MODES[m].mins*60; remaining = totalSecs;
    document.getElementById('timer-mode-label').textContent = MODES[m].label;
    document.querySelectorAll('.mode-tab').forEach((el,i)=>{
      el.classList.toggle('active', ['work','short','long'][i]===m);
    });
    render();
  }

  function onEnd() {
    try { bellEl.currentTime=0; bellEl.play(); } catch(e) {}
    if (mode==='work') {
      sessions++; focusMins+=MODES.work.mins; streak++;
      renderDots(); renderStats();
      setMode(sessions%4===0 ? 'long' : 'short');
    } else {
      setMode('work');
    }
    document.getElementById('timer-btn').textContent = 'Start';
  }

  function toggle() {
    if (running) {
      running=false; clearInterval(iv);
      document.getElementById('timer-btn').textContent='Resume';
    } else {
      running=true;
      document.getElementById('timer-btn').textContent='Pause';
      iv = setInterval(()=>{ remaining--; if(remaining<=0){clearInterval(iv);running=false;onEnd();} render(); },1000);
    }
  }

  function reset() {
    running=false; clearInterval(iv); remaining=totalSecs;
    document.getElementById('timer-btn').textContent='Start';
    render();
  }

  function skip() { running=false; clearInterval(iv); onEnd(); }
  function setBellVol(v) { bellEl.volume=v/100; }

  render(); renderDots(); renderStats();

  return { toggle, reset, skip, setBellVol, setMode };
})();

window.timerSetMode = Timer.setMode;
document.querySelectorAll('.mode-tab').forEach((el,i)=>{
  const modes=['work','short','long'];
  el.onclick=()=>Timer.setMode(modes[i]);
});


/* ═══════════════════════════════════════════════════════
   MODULE 3: MOOD AUDIO — volume only (sound managed by Scene)
   Exposes: MoodAudio.setVol(v)
═══════════════════════════════════════════════════════ */
const MoodAudio = (() => {
  const el = document.getElementById('mood-audio');
  function setVol(v) { el.volume = v/100; }
  return { setVol };
})();


/* ═══════════════════════════════════════════════════════
   MODULE 4: MUSIC — YouTube IFrame player
   Completely isolated. Exposes: Music.toggle(), Music.setVol(v)
   onYouTubeIframeAPIReady must be global for YT API callback
═══════════════════════════════════════════════════════ */
const Music = (() => {
  const TRACKS = [
    { name:'Lo-fi chill beats', id:'OO2kPK5-qno' },
    { name:'Ambient focus',     id:'4GnVDPD01as' },
    { name:'Soft piano',        id:'3NycM9lYdRI' },
  ];

  let player=null, ready=false, playing=false, current=0, vol=40;

  function setStatus(msg) { document.getElementById('music-status').textContent=msg; }
  function setPlayBtn(isPlaying) { document.getElementById('music-btn').innerHTML=isPlaying?'&#9646;&#9646;':'&#9654;'; }

  function renderTracks() {
    const el=document.getElementById('track-list'); el.innerHTML='';
    TRACKS.forEach((t,i)=>{
      const div=document.createElement('div');
      div.className='track'+(i===current?' active':'');
      div.innerHTML='<span class="track-num">'+(i+1)+'</span><div style="flex:1"><div class="track-name">'+t.name+'</div><div class="track-src">YouTube — royalty free</div></div>';
      div.onclick=()=>selectTrack(i);
      el.appendChild(div);
    });
  }

  function selectTrack(i) {
    current=i; renderTracks();
    if (!ready) return;
    player.loadVideoById(TRACKS[i].id);
    if (!playing) player.pauseVideo();
  }

  function toggle() {
    if (!ready) { setStatus('Player loading, please wait...'); return; }
    if (playing) { player.pauseVideo(); }
    else { player.loadVideoById(TRACKS[current].id); player.playVideo(); }
  }

  function setVol(v) {
    vol=parseInt(v);
    if (ready) player.setVolume(vol);
  }

  function init() {
    player = new YT.Player('yt-frame', {
      height:'1', width:'1',
      videoId: TRACKS[0].id,
      playerVars: { autoplay:0, controls:0, disablekb:1, fs:0, iv_load_policy:3, modestbranding:1, rel:0, playsinline:1 },
      events: {
        onReady: (e) => {
          ready=true;
          e.target.setVolume(vol);
          setStatus('Ready — click play');
        },
        onStateChange: (e) => {
          if (e.data===YT.PlayerState.PLAYING) { playing=true;  setPlayBtn(true);  setStatus('Now playing'); }
          if (e.data===YT.PlayerState.PAUSED)  { playing=false; setPlayBtn(false); setStatus('Paused'); }
          if (e.data===YT.PlayerState.ENDED)   { player.playVideo(); }
          if (e.data===YT.PlayerState.BUFFERING){ setStatus('Buffering...'); }
        },
        onError: () => setStatus('Track unavailable — try another')
      }
    });
  }

  renderTracks();
  return { toggle, setVol, init };
})();

window.onYouTubeIframeAPIReady = () => Music.init();

</script>
</body>
</html>
