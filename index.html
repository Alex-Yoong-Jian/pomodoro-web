<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    #yt-player { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; }
    .pom-root { position: relative; min-height: 100vh; overflow: hidden; background: #000; }
    .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; transition: opacity 1.5s ease; opacity: 0; }
    .pom-wrap { position: relative; z-index: 1; padding: 1.5rem 1rem; max-width: 480px; margin: 0 auto; }
    .mode-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 1.5rem; }
    .mode-tab { padding: 6px 16px; border-radius: 20px; font-size: 13px; border: 0.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); cursor: pointer; transition: all 0.2s; }
    .mode-tab.active { background: rgba(83,74,183,0.7); color: #fff; border-color: rgba(83,74,183,0.5); font-weight: 500; }
    .timer-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 0.5px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 2rem 1.5rem; text-align: center; margin-bottom: 1rem; }
    .session-label { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 0.5rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .timer-display { font-size: 72px; font-weight: 500; color: #fff; letter-spacing: -2px; line-height: 1; margin-bottom: 1.5rem; font-variant-numeric: tabular-nums; }
    .progress-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-bottom: 1.5rem; overflow: hidden; }
    .progress-fill { height: 100%; background: #7F77DD; border-radius: 2px; transition: width 1s linear; }
    .controls { display: flex; gap: 12px; justify-content: center; align-items: center; }
    .btn-main { padding: 10px 32px; border-radius: 20px; font-size: 15px; font-weight: 500; background: #534AB7; color: #fff; border: none; cursor: pointer; transition: opacity 0.2s; }
    .btn-main:hover { opacity: 0.85; }
    .btn-icon { width: 36px; height: 36px; border-radius: 50%; border: 0.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .btn-icon:hover { background: rgba(255,255,255,0.15); }
    .session-dots { display: flex; gap: 6px; justify-content: center; margin-top: 1rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); }
    .dot.done { background: #7F77DD; }
    .card { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 0.5px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .card-title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85); }
    .toggle-btn { width: 32px; height: 32px; border-radius: 50%; background: #534AB7; border: none; color: #fff; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .track-list { display: flex; flex-direction: column; gap: 4px; }
    .track { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .track:hover { background: rgba(255,255,255,0.08); }
    .track.active { background: rgba(83,74,183,0.35); }
    .track-num { font-size: 12px; color: rgba(255,255,255,0.35); width: 16px; text-align: center; }
    .track-name { font-size: 13px; color: rgba(255,255,255,0.85); }
    .track-src { font-size: 11px; color: rgba(255,255,255,0.35); }
    .vol-row { display: flex; align-items: center; gap: 10px; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 0.5px solid rgba(255,255,255,0.1); }
    .vol-label { font-size: 12px; color: rgba(255,255,255,0.5); white-space: nowrap; min-width: 52px; }
    .vol-row input[type=range] { flex: 1; accent-color: #534AB7; }
    .stats-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    .stat { background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 0.75rem; text-align: center; }
    .stat-val { font-size: 20px; font-weight: 500; color: #fff; }
    .stat-lbl { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }
    .scene-toggle { display: flex; gap: 6px; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .scene-btn { padding: 5px 14px; border-radius: 12px; font-size: 12px; border: 0.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55); cursor: pointer; transition: all 0.2s; }
    .scene-btn.active { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.4); }
    .divider { height: 0.5px; background: rgba(255,255,255,0.1); margin: 0.75rem 0; }
    .mood-vol-row { display: flex; align-items: center; gap: 10px; }
    .mood-vol-row input[type=range] { flex: 1; accent-color: #534AB7; }
    .yt-status { font-size: 11px; color: rgba(255,255,255,0.35); text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
<div class="pom-root" id="pom-root">
  <div class="bg-overlay" id="bg-overlay"></div>
  <canvas id="bg-canvas"></canvas>
  <div id="yt-player"></div>
  <div class="pom-wrap">

    <div class="scene-toggle">
      <button class="scene-btn" id="sbtn-leaves"    onclick="toggleScene('leaves')">Leaves</button>
      <button class="scene-btn" id="sbtn-snow"      onclick="toggleScene('snow')">Snow</button>
      <button class="scene-btn" id="sbtn-rain"      onclick="toggleScene('rain')">Rain</button>
      <button class="scene-btn" id="sbtn-fireflies" onclick="toggleScene('fireflies')">Fireflies</button>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" onclick="setMode('work')">Focus</button>
      <button class="mode-tab" onclick="setMode('short')">Short break</button>
      <button class="mode-tab" onclick="setMode('long')">Long break</button>
    </div>

    <div class="timer-card">
      <div class="session-label" id="session-label">Focus session</div>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:100%"></div></div>
      <div class="controls">
        <button class="btn-icon" onclick="resetTimer()" title="Reset">&#8635;</button>
        <button class="btn-main" id="btn-startstop" onclick="toggleTimer()">Start</button>
        <button class="btn-icon" onclick="skipSession()" title="Skip">&#8677;</button>
      </div>
      <div class="session-dots" id="session-dots"></div>
      <div class="divider"></div>
      <div class="vol-row" style="margin-top:0;padding-top:0;border-top:none;">
        <span class="vol-label">Timer vol</span>
        <input type="range" min="0" max="100" value="80" step="1" oninput="setBellVolume(this.value)" />
      </div>
    </div>

    <div class="stats-row" style="margin-bottom:1rem;">
      <div class="stat"><div class="stat-val" id="stat-sessions">0</div><div class="stat-lbl">Sessions</div></div>
      <div class="stat"><div class="stat-val" id="stat-focus">0</div><div class="stat-lbl">Focus mins</div></div>
      <div class="stat"><div class="stat-val" id="stat-streak">0</div><div class="stat-lbl">Streak</div></div>
    </div>

    <div class="card" id="mood-card" style="display:none;">
      <div class="card-header">
        <span class="card-title" id="mood-card-title">Mood sounds</span>
      </div>
      <div class="mood-vol-row">
        <span class="vol-label" style="font-size:12px;color:rgba(255,255,255,0.5);min-width:52px;">Volume</span>
        <input type="range" min="0" max="100" value="50" step="1" id="mood-vol-slider" oninput="setMoodVolume(this.value)" />
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Background music</span>
        <button class="toggle-btn" id="music-toggle-btn" onclick="toggleMusic()">&#9654;</button>
      </div>
      <div class="track-list" id="track-list"></div>
      <div class="vol-row">
        <span class="vol-label">Volume</span>
        <input type="range" min="0" max="100" value="40" step="1" id="yt-vol-slider" oninput="setYTVolume(this.value)" />
      </div>
      <div class="yt-status" id="yt-status">Click play to start music</div>
    </div>

  </div>
</div>

<audio id="mood-audio" loop></audio>
<audio id="bell-audio" src="https://cdn.jsdelivr.net/gh/freeCodeCamp/cdn@main/build/testable-projects-fcc/audio/BeepSound.wav"></audio>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const MODES = {
  work:  { label: 'Focus session', mins: 25 },
  short: { label: 'Short break',   mins: 5  },
  long:  { label: 'Long break',    mins: 15 }
};

const TRACKS = [
  { name: 'Lo-fi chill beats', id: 'OO2kPK5-qno', author: 'YouTube' },
  { name: 'Ambient focus',     id: '4GnVDPD01as', author: 'YouTube' },
  { name: 'Soft piano',        id: '3NycM9lYdRI', author: 'YouTube' },
];

const SCENES = {
  leaves: {
    label: 'Forest & leaves',
    sound: 'https://res.cloudinary.com/dbk2nmvor/video/upload/v1774950057/forest-nature_cvejvc.mp3',
    bg: ['#1a2a1a','#2d3a2d','#1a2535'], count: 38,
    make: (W,H) => ({ x:Math.random()*W, y:-20, size:6+Math.random()*10, speedY:0.6+Math.random()*1.2, speedX:-0.5+Math.random()*1, rot:Math.random()*360, rotSpeed:(-1+Math.random()*2)*1.2, sway:Math.random()*2, swaySpeed:0.01+Math.random()*0.02, swayOffset:Math.random()*Math.PI*2, color:['#5a8a3a','#7aaa4a','#3a6a2a','#8aaa5a','#c8a030','#d4602a'][Math.floor(Math.random()*6)], t:0, W, H, alpha:1 }),
    draw: (p) => { ctx.save(); ctx.translate(p.x+Math.sin(p.swayOffset+p.t*p.swaySpeed)*p.sway*18,p.y); ctx.rotate(p.rot*Math.PI/180); ctx.fillStyle=p.color; ctx.globalAlpha=0.82*(p.alpha||1); ctx.beginPath(); ctx.ellipse(0,0,p.size*0.45,p.size,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=0.5; ctx.beginPath(); ctx.moveTo(0,-p.size); ctx.lineTo(0,p.size); ctx.stroke(); ctx.restore(); },
    update: (p) => { p.t++; p.y+=p.speedY*(fadingOut?1.8:1); p.x+=p.speedX+Math.cos(p.swayOffset+p.t*p.swaySpeed)*0.4; p.rot+=p.rotSpeed; if(fadingOut) p.alpha=Math.max(0,(p.alpha||1)-0.008); return p.y<p.H+30&&(p.alpha||1)>0; }
  },
  snow: {
    label: 'Winter snowfall',
    sound: 'https://res.cloudinary.com/dbk2nmvor/video/upload/v1774950055/cold-snowfall_wcro7h.mp3',
    bg: ['#1a2535','#253045','#1a2030'], count: 60,
    make: (W,H) => ({ x:Math.random()*W, y:-10, size:2+Math.random()*5, speedY:0.4+Math.random()*0.9, speedX:-0.3+Math.random()*0.6, opacity:0.4+Math.random()*0.5, swaySpeed:0.008+Math.random()*0.015, t:Math.random()*100, W, H, alpha:1 }),
    draw: (p) => { ctx.save(); ctx.globalAlpha=p.opacity*(p.alpha||1); ctx.fillStyle='#d0e8ff'; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.restore(); },
    update: (p) => { p.t++; p.y+=p.speedY*(fadingOut?1.8:1); p.x+=p.speedX+Math.sin(p.t*p.swaySpeed)*0.5; if(fadingOut) p.alpha=Math.max(0,(p.alpha||1)-0.008); return p.y<p.H+10&&(p.alpha||1)>0; }
  },
  rain: {
    label: 'Relaxing rain',
    sound: 'https://res.cloudinary.com/dbk2nmvor/video/upload/v1774950059/relaxing-rain_dk2qvp.mp3',
    bg: ['#111820','#1a2530','#0e1520'], count: 80,
    make: (W,H) => ({ x:Math.random()*W, y:Math.random()*H*-1, len:10+Math.random()*20, speed:8+Math.random()*8, opacity:0.2+Math.random()*0.4, W, H, alpha:1 }),
    draw: (p) => { ctx.save(); ctx.globalAlpha=p.opacity*(p.alpha||1); ctx.strokeStyle='#a0c8e8'; ctx.lineWidth=0.7; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.len*0.2,p.y+p.len); ctx.stroke(); ctx.restore(); },
    update: (p) => { p.y+=p.speed*(fadingOut?2:1); p.x-=p.speed*0.2; if(fadingOut) p.alpha=Math.max(0,(p.alpha||1)-0.012); return p.y<p.H+30&&(p.alpha||1)>0; }
  },
  fireflies: {
    label: 'Night forest',
    sound: 'https://res.cloudinary.com/dbk2nmvor/video/upload/v1774950057/night-forest_whjxt1.mp3',
    bg: ['#0a1a10','#0e2015','#0a1520'], count: 30,
    make: (W,H) => ({ x:Math.random()*W, y:Math.random()*H, r:2+Math.random()*3, speedX:(-0.4+Math.random()*0.8)*0.6, speedY:(-0.4+Math.random()*0.8)*0.6, phase:Math.random()*Math.PI*2, phaseSpeed:0.02+Math.random()*0.03, t:0, W, H, alpha:1 }),
    draw: (p) => { const g=(Math.sin(p.phase+p.t*p.phaseSpeed)+1)/2; ctx.save(); ctx.globalAlpha=(0.15+g*0.7)*(p.alpha||1); ctx.fillStyle='#c8f060'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r+g*2,0,Math.PI*2); ctx.fill(); ctx.restore(); },
    update: (p) => { p.t++; p.x+=p.speedX; p.y+=p.speedY; if(fadingOut) p.alpha=Math.max(0,(p.alpha||1)-0.006); if(!fadingOut){if(p.x<0)p.x=p.W;if(p.x>p.W)p.x=0;if(p.y<0)p.y=p.H;if(p.y>p.H)p.y=0;} return (p.alpha||1)>0; }
  }
};

let mode='work', totalSecs=1500, remaining=1500;
let running=false, timerInterval=null;
let sessionsCompleted=0, focusMins=0, streak=0;
let currentTrack=0, musicPlaying=false, ytReady=false, ytVolume=40;
let activeScene=null, fadingOut=false, particles=[];
let fadeTimeout=null, ytPlayer=null;

const moodAudio = document.getElementById('mood-audio');
const bellAudio  = document.getElementById('bell-audio');
const canvas     = document.getElementById('bg-canvas');
const ctx        = canvas.getContext('2d');
const overlay    = document.getElementById('bg-overlay');

moodAudio.volume = 0.5;
bellAudio.volume = 0.8;

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-player', {
    height: '1', width: '1',
    videoId: TRACKS[0].id,
    playerVars: { autoplay:0, controls:0, disablekb:1, fs:0, iv_load_policy:3, modestbranding:1, rel:0 },
    events: {
      onReady: (e) => { ytReady=true; e.target.setVolume(ytVolume); setStatus('Ready — click play'); },
      onStateChange: (e) => {
        if(e.data===YT.PlayerState.ENDED) ytPlayer.playVideo();
        if(e.data===YT.PlayerState.PLAYING) { setStatus('Now playing'); document.getElementById('music-toggle-btn').innerHTML='&#9646;&#9646;'; musicPlaying=true; }
        if(e.data===YT.PlayerState.PAUSED)  { setStatus('Paused'); document.getElementById('music-toggle-btn').innerHTML='&#9654;'; musicPlaying=false; }
      },
      onError: () => setStatus('Track unavailable — try another')
    }
  });
}

function setStatus(msg) { document.getElementById('yt-status').textContent=msg; }

function toggleMusic() {
  if (!ytReady) { setStatus('Player loading, please wait...'); return; }
  if (musicPlaying) { ytPlayer.pauseVideo(); }
  else { ytPlayer.loadVideoById(TRACKS[currentTrack].id); ytPlayer.playVideo(); }
}

function selectTrack(i) {
  currentTrack=i; renderTracks();
  if (!ytReady) return;
  ytPlayer.loadVideoById(TRACKS[i].id);
  if (musicPlaying) ytPlayer.playVideo(); else ytPlayer.pauseVideo();
}

function setYTVolume(v) { ytVolume=parseInt(v); if(ytReady) ytPlayer.setVolume(ytVolume); }
function setMoodVolume(v) { moodAudio.volume=v/100; }
function setBellVolume(v) { bellAudio.volume=v/100; }
function pad(n) { return String(n).padStart(2,'0'); }

function resizeCanvas() {
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

function spawnParticles() {
  if (!activeScene) return;
  const sc=SCENES[activeScene], W=canvas.width, H=canvas.height;
  while (particles.length<sc.count) particles.push(sc.make(W,H));
}

function animLoop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (activeScene||particles.length>0) {
    const sc=SCENES[activeScene||'leaves'];
    if (!fadingOut) spawnParticles();
    particles=particles.filter(p=>{sc.draw(p);return sc.update(p);});
  }
  requestAnimationFrame(animLoop);
}

function toggleScene(s) {
  if (activeScene===s) { startFadeOut(); return; }
  if (fadingOut) { clearTimeout(fadeTimeout); fadingOut=false; }
  particles=[]; activeScene=s;
  const sc=SCENES[s];
  overlay.style.background='linear-gradient(160deg,'+sc.bg[0]+' 0%,'+sc.bg[1]+' 40%,'+sc.bg[2]+' 100%)';
  overlay.style.opacity='1';
  document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sbtn-'+s).classList.add('active');
  document.getElementById('mood-card').style.display='block';
  document.getElementById('mood-card-title').textContent=sc.label;
  moodAudio.src=sc.sound; moodAudio.load(); moodAudio.currentTime=0; moodAudio.play().catch(()=>{});
}

function startFadeOut() {
  fadingOut=true;
  document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('active'));
  overlay.style.opacity='0';
  moodAudio.pause();
  document.getElementById('mood-card').style.display='none';
  fadeTimeout=setTimeout(()=>{ fadingOut=false; activeScene=null; particles=[]; },2000);
}

function renderDisplay() {
  document.getElementById('timer-display').textContent=pad(Math.floor(remaining/60))+':'+pad(remaining%60);
  document.getElementById('progress-fill').style.width=Math.round((remaining/totalSecs)*100)+'%';
}

function renderDots() {
  const el=document.getElementById('session-dots'); el.innerHTML='';
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='dot'+(i<sessionsCompleted%4?' done':'');el.appendChild(d);}
}

function renderStats() {
  document.getElementById('stat-sessions').textContent=sessionsCompleted;
  document.getElementById('stat-focus').textContent=focusMins;
  document.getElementById('stat-streak').textContent=streak;
}

function renderTracks() {
  const el=document.getElementById('track-list'); el.innerHTML='';
  TRACKS.forEach((t,i)=>{
    const div=document.createElement('div');
    div.className='track'+(i===currentTrack?' active':'');
    div.innerHTML='<span class="track-num">'+(i+1)+'</span><div style="flex:1"><div class="track-name">'+t.name+'</div><div class="track-src">YouTube — royalty free</div></div>';
    div.onclick=()=>selectTrack(i);
    el.appendChild(div);
  });
}

function setMode(m) {
  mode=m; running=false; clearInterval(timerInterval);
  document.getElementById('btn-startstop').textContent='Start';
  totalSecs=MODES[m].mins*60; remaining=totalSecs;
  document.getElementById('session-label').textContent=MODES[m].label;
  document.querySelectorAll('.mode-tab').forEach((el,i)=>{el.classList.toggle('active',['work','short','long'][i]===m);});
  renderDisplay();
}

function toggleTimer() {
  if(running){ running=false; clearInterval(timerInterval); document.getElementById('btn-startstop').textContent='Resume'; }
  else { running=true; document.getElementById('btn-startstop').textContent='Pause'; timerInterval=setInterval(()=>{ remaining--; if(remaining<=0){clearInterval(timerInterval);running=false;onSessionEnd();} renderDisplay(); },1000); }
}

function onSessionEnd() {
  try{bellAudio.currentTime=0;bellAudio.play();}catch(e){}
  if(mode==='work'){ sessionsCompleted++;focusMins+=MODES.work.mins;streak++;renderDots();renderStats(); if(sessionsCompleted%4===0)setMode('long');else setMode('short'); }
  else { setMode('work'); }
  document.getElementById('btn-startstop').textContent='Start';
}

function resetTimer(){running=false;clearInterval(timerInterval);remaining=totalSecs;document.getElementById('btn-startstop').textContent='Start';renderDisplay();}
function skipSession(){running=false;clearInterval(timerInterval);onSessionEnd();}

resizeCanvas();
window.addEventListener('resize',resizeCanvas);
renderDisplay();renderDots();renderStats();renderTracks();
animLoop();
</script>
</body>
</html>
